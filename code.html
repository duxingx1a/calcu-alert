<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CalcuAlert · 代码仓库</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
  color: #1a1a2e;
  background: #fafbfc;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 2rem;
}
.card {
  background: #fff;
  border: 1px solid #e8ecf2;
  border-radius: 12px;
  padding: 3rem 4rem;
  text-align: center;
  max-width: 560px;
  box-shadow: 0 4px 24px rgba(0,0,0,.06);
}
.card h1 { font-size: 1.6rem; margin-bottom: .8rem; }
.card p { font-size: .95rem; color: #555; line-height: 1.7; margin-bottom: 1.5rem; }
.card .note {
  background: #fff8e1;
  border: 1px solid #ffe082;
  border-radius: 8px;
  padding: .8rem 1rem;
  font-size: .82rem;
  color: #8d6e00;
  margin-bottom: 1.5rem;
}
.card a {
  display: inline-block;
  padding: .55rem 1.5rem;
  background: #3b6ea5;
  color: #fff;
  text-decoration: none;
  border-radius: 6px;
  font-size: .9rem;
  font-weight: 500;
  transition: background .2s;
}
.card a:hover { background: #2a4f7a; }
</style>
</head>
<body>
<div class="card">
  <h1>代码仓库</h1>
  <p>本项目的完整训练、验证、图表生成代码将在以下仓库发布。</p>
  <div class="note">GitHub 链接正在准备中，敬请期待。</div>
  <a href="index.html">返回主页</a>
</div>
</body>
</html>
