<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CalcuAlert · 尿路结石风险计算与个体解释</title>
  <meta name="description" content="基于真实十模型堆叠推理与严格87维SHAP解释的尿路结石科研风险计算器">
  <link rel="stylesheet" href="assets/css/calculator.css">
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div><div class="kicker">在线风险计算器</div><h1>尿路结石风险计算与个体解释</h1><p class="subtitle">CalcuAlert · 基于多模型集成的尿路结石患病风险在线评估</p></div>
      <a class="back-link" href="index.html">返回研究主页</a>
    </header>

    <section class="intro" aria-label="模型说明">
    </section>

    <div class="status" role="status"><span id="apiDot" class="status-dot"></span><span id="apiText">正在核验模型工件…</span></div>
    <section class="quickbar"><div><span class="quickbar-label">示例病例</span><div id="samples" class="samples" aria-label="示例输入"></div></div><div class="quick-actions"><button id="calculateButton" class="primary" type="submit" form="calculatorForm">计算风险并解释</button><button id="resetButton" class="secondary" type="button">清空</button></div></section>

    <form id="calculatorForm" novalidate>
      <section class="panel"><div class="panel-header"><h2>主要特征（必填）</h2></div><div id="requiredFields" class="field-grid"></div></section>
      <section class="panel"><div class="panel-header"><h2>临床特征（选填）</h2></div><div id="optionalFields"></div></section>
      <p class="disclaimer">本工具用于科研演示和模型复现，不构成诊断、治疗建议或临床决策依据。请勿输入可识别患者身份的信息。</p>
    </form>

    <section id="resultPanel" class="panel result-panel" aria-live="polite" style="display:none">
      <div class="panel-header"><h2>三、计算结果</h2><small id="featureCount"></small></div>
      <div class="result-top-row"><div id="resultSummary" class="result-summary"></div><article class="subpanel prob-panel"><h3>各模型阳性概率</h3><div id="baseProbabilities" class="prob-grid"></div></article></div>
      <p id="imputationNote" class="result-note"></p>
      <article class="subpanel"><h3>SHAP Force Plot · 特征贡献力</h3><div class="chart-wrap"><canvas id="forcePlot" class="chart" aria-label="SHAP Force Plot"></canvas></div></article>
      <article class="subpanel"><h3>SHAP 瀑布图 · 局部解释前 14 项</h3><div class="chart-wrap"><canvas id="waterfallPlot" class="chart" aria-label="SHAP瀑布图"></canvas></div></article>
      <article class="subpanel"><h3>完整贡献数据</h3><div class="table-wrap"><table class="shap-table"><thead><tr><th>秩</th><th>输入项</th><th>类型</th><th>填入值</th><th>SHAP</th></tr></thead><tbody id="shapTableBody"></tbody></table></div></article>
    </section>
    <div id="resultToggleBar" class="actions" style="display:none;text-align:center;margin-top:14px"><button id="toggleResult" class="secondary" type="button">收起结果</button></div>
  </main>
  <script type="module" src="assets/js/demo-app.js?v=250736"></script>
</body>
</html>
